# Render Blueprint — agent (Docker) + Redis (Key Value)
services:
  - type: web
    name: production-ai-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile   # tương đối với rootDir
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"
      - key: AGENT_API_KEY
        sync: false            # nhập tay trên dashboard, không ghi vào repo
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agent-redis
          property: connectionString

  - type: keyvalue
    name: agent-redis
    plan: free
    region: singapore
    ipAllowList: []            # chỉ cho service nội bộ truy cập
